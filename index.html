<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year</title>
<style>
body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}
.card {
  width: 90%;
  max-width: 350px;
  height: 500px;
  background: #111;
  border-radius: 20px;
  box-shadow: 0 0 30px rgba(255,255,255,0.2);
  text-align: center;
  padding: 20px;
  cursor: pointer;
  animation: fadeIn 1s ease;
}
h1 { font-size: 28px; margin-top: 40px; }
p { font-size: 18px; line-height: 1.5; }
.small { font-size: 14px; opacity: 0.8; margin-top: 20px; }

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}
.confetti {
  position: absolute;
  top: 0;
  width: 100%;
  height: 100%;
  background-image: radial-gradient(#ffcc00 2px, transparent 2px),
                    radial-gradient(#ff6699 2px, transparent 2px),
                    radial-gradient(#66ffcc 2px, transparent 2px);
  background-size: 50px 50px;
  animation: move 10s linear infinite;
}
@keyframes move {
  from { background-position: 0 0; }
  to { background-position: 200px 400px; }
}
</style>
</head>
<body>

<div class="confetti"></div>

<div class="card" onclick="nextPage()">
  <div id="content"></div>
</div>

<script>
let page = 0;
const content = document.getElementById("content");

const pages = [
  `<h1>🎉 Happy New Year 🎆</h1>
   <p>Tap to open your New Year surprise!</p>
   <p class="small">✨ Touch the card ✨</p>`,

  `<h1>💖 Best Wishes 💖</h1>
   <p>May this New Year bring you<br>
   happiness, smiles, success,<br>
   and lots of beautiful moments 🌟</p>
   <p class="small">Tap to continue ➡️</p>`,

  `<h1>🎊 Party Time 🎊</h1>
   <p>🐼🦊🐻 Dancing animals<br>
   🎭 Cartoon friends<br>
   🎶 Music • Fun • Laughter</p>
   <p>Let’s celebrate the New Year together! 🥳</p>
   <p class="small">Tap again ➡️</p>`,

  `<h1>✨ With Love ✨</h1>
   <p>Wishing you an amazing year ahead 💫</p>
   <h2>— Avinash Kumar</h2>
   <p class="small">🎆 Happy New Year 🎆</p>`
];

function nextPage() {
  page = (page + 1) % pages.length;
  content.innerHTML = pages[page];
}

content.innerHTML = pages[0];
</script>

</body>
</html>
